spring.application.name=surest-member-managemant
server.port=8086

# DB Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/surestDB
spring.datasource.username=postgres
spring.datasource.password=root
spring.jpa.properties.hibernate.default_schema=surestDB
spring.datasource.hikari.data-source-properties.timeZone=Asia/Kolkata


spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JPA should NOT create tables - Flyway will
spring.jpa.hibernate.ddl-auto=validate

# Flyway Config
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT configuration
app.jwt.secret=MySuperSecretKey1234567890123456
app.jwt.expiration-ms=3600000
